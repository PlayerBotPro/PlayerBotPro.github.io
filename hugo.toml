baseURL = 'https://PlayerBotPro.github.io/'
title = 'PlayerBotPro'
theme = 'hugo-book'
disableKinds = ["taxonomy", "term"]
defaultContentLanguage = 'en' # This makes English the default when people visit

[params]
  BookTheme = 'auto'
  BookSection = 'docs'
  BookHidden = true

# --- MULTI-LANGUAGE SETUP ---

[languages]
  [languages.en]
    languageName = 'English'
    contentDir = 'exampleSite/content'    # <-- Updated path
    weight = 1

  [languages.zh]
    languageName = '中文'
    contentDir = 'exampleSite/content.zh' # <-- Updated path
    weight = 2